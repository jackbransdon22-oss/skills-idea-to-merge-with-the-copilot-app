<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Todo — LocalStorage</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <h1>To‑Do List</h1>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <input id="todo-input" name="todo" type="text" placeholder="What needs doing?" aria-label="New todo" />
      <button type="submit">Add</button>
    </form>

    <section class="controls">
      <div class="filters" role="tablist" aria-label="Filters">
        <button class="filter-btn" data-filter="all" aria-pressed="true">All</button>
        <button class="filter-btn" data-filter="active" aria-pressed="false">Active</button>
        <button class="filter-btn" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
      <div class="actions">
        <button id="clear-completed">Clear completed</button>
      </div>
    </section>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <footer class="status">
      <span id="count">0 items left</span>
    </footer>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
